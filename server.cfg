exec secrets.cfg
exec permissions.cfg

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_hostname "Nano Roleplay"
sets sv_projectName "Nano Roleplay"
sets sv_projectDesc "Nano Roleplay, Build and live your own story in a persistent world. Join us and be part of the community!"
sets tags "nano,roleplay"
sets locale "en-EU"

sv_maxclients 10
sv_scriptHookAllowed 0
setr sv_showBusySpinnerOnLoadingScreen false
setr veltma_identity_max_distance "15"
setr veltma_identity_fade_distance "10"
setr veltma_identity_show_own_tag "false"
setr veltma_identity_show_through_walls "false"
setr veltma_identity_require_line_of_sight "true"
setr veltma_identity_show_name "true"
setr veltma_identity_format "id-name"
setr veltma_identity_render_interval_ms "50"
set veltma_death_respawn_delay_seconds "30"
set veltma_death_respawn_health "200"
set veltma_death_persistence_minutes "15"
set veltma_death_show_killer_identity "true"
## [txAdmin CFG validator]: onesync MUST only be set in the txAdmin settings page.
# set onesync on

ensure mapmanager
ensure chat
ensure spawnmanager
ensure veltma-gametype
ensure veltma-map
