exec secrets.cfg
exec permissions.cfg

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_hostname "Nano Roleplay"
sets sv_projectName "Nano Roleplay"
sets sv_projectDesc "Nano Roleplay, Build and live your own story in a persistent world. Join us and be part of the community!"
sets tags "nano,roleplay"
sets locale "en-EU"

sv_maxclients 10
sv_scriptHookAllowed 0
setr sv_showBusySpinnerOnLoadingScreen false
## [txAdmin CFG validator]: onesync MUST only be set in the txAdmin settings page.
# set onesync on

ensure mapmanager
ensure chat
ensure spawnmanager
ensure veltma-gametype
ensure veltma-map
esure [NanoMLO]
ensure veltma-core
ensure veltma-loading
ensure veltma-world
ensure veltma-account
ensure veltma-character
ensure veltma-spawn
